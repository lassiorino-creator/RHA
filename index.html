<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Rhino's Agency</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Manrope:wght@400;500;700&display=swap">

<style>

:root{--bg:#E4E4E6;--surface:#fff;--ink:#000;--mute:#5C5C60;--line:#C4C4C8;--accent:#000;--accent-ink:#fff;--hot:#6E6E73;

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0E0F;--surface:#1A1A1C;--ink:#F2F2F2;--mute:#A3A3A8;--line:#333336;--accent:#F2F2F2;--accent-ink:#0E0E0F;--hot:#A3A3A8}}

:root[data-theme="dark"]{--bg:#0E0E0F;--surface:#1A1A1C;--ink:#F2F2F2;--mute:#A3A3A8;--line:#333336;--accent:#F2F2F2;--accent-ink:#0E0E0F;--hot:#A3A3A8}

html{scroll-padding-top:env(safe-area-inset-top,0px)}

*,*:before,*:after{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 Manrope,system-ui,sans-serif}

h1,h2,h3{font-family:"Big Shoulders Display",Impact,sans-serif;line-height:.95;margin:0;letter-spacing:.01em}

h1{font-size:clamp(3.4rem,13vw,9rem);font-weight:900}

h2{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:900;margin-bottom:.4em}

h3{font-size:1.5rem;font-weight:700}

p{margin:.4em 0;max-width:62ch}

a{color:inherit}

:focus-visible{outline:3px solid var(--hot);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--ink)}

nav{display:flex;align-items:center;gap:.25rem;padding:.6rem 1rem;max-width:1100px;margin:auto;overflow-x:auto}

.logo{font:900 1.5rem "Big Shoulders Display",sans-serif;margin-right:auto;text-decoration:none;white-space:nowrap}

nav button{font:700 .95rem Manrope,sans-serif;background:none;border:0;color:var(--ink);padding:.5rem .8rem;border-radius:6px;cursor:pointer;white-space:nowrap}

nav button[aria-current=page]{background:var(--ink);color:var(--bg)}

main{max-width:1100px;margin:auto;padding:2rem 1rem 4rem}

section.page{display:none}section.page.on{display:block}

.hero{padding:2rem 0 3rem;border-bottom:2px solid var(--ink);margin-bottom:2.5rem}

.hero h1 span{display:block}

.hero h1 span:nth-child(2){color:var(--mute);margin-left:.4em}

.lead{font-size:1.2rem;margin-top:1.2rem}

.btn{display:inline-block;margin-top:1.2rem;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;padding:.8rem 1.4rem;border-radius:8px;border:0;cursor:pointer;font-family:inherit;font-size:1rem}

.btn.alt{background:none;color:var(--ink);border:2px solid var(--ink);margin-left:.5rem}

.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}

.card{background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:1.1rem}

.card p{color:var(--mute);font-size:.95rem}

.avatar{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:900 1.6rem "Big Shoulders Display",sans-serif;margin-bottom:.7rem}

.role{font-weight:700;color:var(--accent);font-size:.9rem}

.links{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}

.links a{font-size:.8rem;font-weight:700;border:1.5px solid var(--line);border-radius:99px;padding:.15rem .65rem;text-decoration:none}

.links a:hover{border-color:var(--accent);color:var(--accent)}

.sub{margin:2.5rem 0 1rem;padding-bottom:.4rem;border-bottom:2px solid var(--ink)}

.tabs{display:flex;gap:.4rem;margin:1rem 0;flex-wrap:wrap}

.tabs button{font:700 .9rem Manrope,sans-serif;padding:.45rem .9rem;border:2px solid var(--ink);background:none;color:var(--ink);border-radius:99px;cursor:pointer}

.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

.steps li{counter-increment:s;padding:1rem;border-left:4px solid var(--accent);background:var(--surface)}

.steps li:before{content:counter(s);font:900 2rem "Big Shoulders Display",sans-serif;color:var(--accent);display:block}

.live{display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;background:var(--surface);border:2px solid var(--ink);border-radius:10px;margin-bottom:.6rem}

.live time{font:900 1.5rem "Big Shoulders Display",sans-serif;min-width:4.2rem;color:var(--hot)}

.live small{color:var(--mute);margin-left:auto}

.tier{position:relative}

.tier ul{padding-left:1.1rem;margin:.6rem 0 0}

.tier li{margin:.25rem 0}

.tier.top{background:var(--ink);color:var(--bg)}.tier.top p,.tier.top li::marker{color:var(--bg)}

.logo-box{height:90px;border:2px dashed var(--line);border-radius:8px;display:grid;place-items:center;font:900 1.6rem "Big Shoulders Display",sans-serif;margin-bottom:.8rem;color:var(--mute)}

.hero{display:grid;gap:2rem;grid-template-columns:1fr;align-items:center}

@media(min-width:860px){.hero{grid-template-columns:1.3fr 1fr}}

.hero-logo{width:100%;max-width:420px;border-radius:14px;border:2px solid var(--ink);justify-self:center}

.logo img{height:34px;width:34px;border-radius:6px;vertical-align:middle;margin-right:.5rem}

footer{border-top:2px solid var(--ink);padding:1.5rem 1rem;text-align:center;color:var(--mute);font-size:.9rem}

@media(prefers-reduced-motion:no-preference){.hero h1 span{animation:in .6s both}.hero h1 span:nth-child(2){animation-delay:.12s}@keyframes in{from{opacity:0;transform:translateY(14px)}}}

</style>

</head>
