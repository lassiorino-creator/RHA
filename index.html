<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhino's Agency</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #E4E4E6;
            --ink: #000000;
            --mute: #5C5C60;
            --card-bg: #FFFFFF;
            --border: #D1D1D6;
            --accent: #000000;
            --accent-text: #FFFFFF;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121214;
                --ink: #FFFFFF;
                --mute: #A1A1A6;
                --card-bg: #1C1C1E;
                --border: #2C2C2E;
                --accent: #FFFFFF;
                --accent-text: #000000;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: 'Manrope', sans-serif;
            line-height: 1.5;
            padding: 2rem 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header / Navbar */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--ink);
        }

        .brand h1 {
            font-family: 'Big Shoulders Display', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Hero Section Originale */
        .hero {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-bottom: 5rem;
        }

        @media (min-width: 860px) {
            .hero {
                grid-template-columns: 1.3fr 1fr;
                align-items: center;
            }
        }

        .hero-text h1 {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: clamp(3.4rem, 13vw, 9rem);
            line-height: 0.9;
            font-weight: 900;
            text-transform: uppercase;
            animation: in 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hero-text h1 span {
            display: block;
            color: var(--mute);
            margin-left: 0.4em;
        }

        .hero-text p {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            color: var(--mute);
            max-width: 500px;
        }

        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="#" class="brand">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2L2 7l10 5 10-5-10-5z'/><path d='M2 17l10 5 10-5'/><path d='M2 12l10 5 10-5'/></svg>" alt="Rhino's Logo">
            <h1>Rhino's Agency</h1>
        </a>
    </header>

    <!-- Main Hero -->
    <main class="hero">
        <div class="hero-text">
            <h1>
                Rhino's
                <span>Agency</span>
            </h1>
            <p>Descrizione della tua agenzia qui.</p>
        </div>
        <div class="hero-logo">
            <!-- Eventuale immagine o grafica -->
        </div>
    </main>

</body>
</html>
